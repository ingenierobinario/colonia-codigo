name: Instaladores

on:
  workflow_dispatch:

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: mac
            arch: arm64
          - runner: macos-15-intel
            os: mac
            arch: x64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # El .rpm lo construye rpmbuild, que Ubuntu no trae.
      - if: matrix.os == 'linux'
        run: command -v rpmbuild >/dev/null || sudo apt-get install -y rpm
      - run: corepack pnpm package:${{ matrix.os }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: colonia-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            out/*.dmg
            out/*.AppImage
            out/*.deb
            out/*.rpm
            out/Colonia-*.zip
            out/colonia-core-*.tar.gz
            out/*.sha256
            out/install.sh
            out/install.ps1
          if-no-files-found: error
          retention-days: 30
