# ACTUALIZACIONES-1: publica una versión que las Colonias instaladas descargan solas (D-044, D-058).
# Se dispara al empujar una etiqueta v2.X.Y. Compila los instaladores de cada plataforma y los sube como versión
# al repositorio PÚBLICO ingenierobinario/colonia (RELEASE_FEED), que solo guarda instaladores, nunca código.
# Las notas de la versión (qué trae, en español y en inglés) se escriben en apps/core/src/release-highlights.ts;
# scripts/release-body.ts las convierte en el cuerpo de la versión y cada app instalada las enseña en el idioma de la
# persona. Antes de etiquetar: node scripts/release-body.ts v2.27.0 --check
# Si la versión no tiene notas ahí, se usa el mensaje de la etiqueta como antes: cada línea «- …» es una novedad.
name: Publicar versión

on:
  push:
    tags: ["v2.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a publicar (v2.X.Y)"
        required: true
      ref:
        description: "Commit o rama a compilar (vacío = la etiqueta)"
        default: ""
      prueba:
        description: "Publicarla como prelanzamiento: las apps instaladas la ignoran"
        type: boolean
        default: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FEED: ingenierobinario/colonia

jobs:
  instalador:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: windows-2022, os: win, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Compilar
        shell: bash
        run: |
          [[ "$TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]] || { echo "etiqueta no válida: $TAG"; exit 1; }
          COLONIA_VERSION="${TAG#v}" corepack pnpm package:${{ matrix.os }} --${{ matrix.arch }}
      - name: Comprobar y arrancar lo construido
        shell: bash
        run: |
          # Lo que lleva esta plataforma (y sus sumas), el core instalado con su script y la app empaquetada arrancando.
          if [ "${{ matrix.os }}" = linux ] && ! command -v xvfb-run >/dev/null; then sudo apt-get install -y xvfb; fi
          node scripts/release-assets.ts "${TAG#v}" out --platform ${{ matrix.os }}-${{ matrix.arch }}
          node scripts/smoke-artifacts.ts "${TAG#v}" ${{ matrix.os }} ${{ matrix.arch }} out
      - uses: actions/upload-artifact@v4
        with:
          name: colonia-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            out/*.dmg
            out/*.AppImage
            out/*.exe
            out/Colonia-*.zip
            out/colonia-core-*.tar.gz
            out/*.sha256
            out/install.sh
            out/install.ps1
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: instalador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
      - name: Notas de la versión
        run: |
          # Lo que trae la versión, en los dos idiomas. Sin notas escritas (o sin Node), el mensaje de la etiqueta.
          node scripts/release-body.ts "$TAG" > notas.md || true
          if ! grep -qE '^[-*] ' notas.md; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            git tag -l --format='%(contents)' "$TAG" > notas.md || true
          fi
          [ -s notas.md ] || echo "- Colonia ${TAG#v}" > notas.md
          cat notas.md
      - name: Publicar en el repositorio público
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ls -la dist
          # Los 32 ficheros exactos y cada suma, antes de que nada sea público (create ya sube como borrador).
          node scripts/release-assets.ts "${TAG#v}" dist
          if gh release view "$TAG" -R "$FEED" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$FEED" --clobber
          else
            gh release create "$TAG" dist/* -R "$FEED" --target main --title "Colonia ${TAG#v}" --notes-file notas.md               ${{ inputs.prueba && '--prerelease' || '' }}
          fi
