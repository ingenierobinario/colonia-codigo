name: Diagnóstico de rendimiento de Colonia
on:
  push:
    branches: [codex/diagnostico-perf-251]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_COLONIA_RAILWAY_TEMPLATE: ${{ vars.COLONIA_RAILWAY_TEMPLATE }}
      VITE_COLONIA_RAILWAY_REFERRAL: ${{ vars.COLONIA_RAILWAY_REFERRAL }}
      COLONIA_SECRETS: file
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6df75475bb4c754330521247446dcf11ab90900
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Medir las dos versiones con el mismo equipo y los presupuestos originales
        run: |
          directorio="$RUNNER_TEMP/informes-aislados"
          mkdir -p "$directorio"
          lscpu > "$directorio/procesador.txt"
          nproc >> "$directorio/procesador.txt"
          df -T "$GITHUB_WORKSPACE" > "$directorio/disco.txt"
          fallo=0
          for serie in base candidata; do
            case "$serie" in
              base) sha=ddebebff6ea5645fe4558c9e9162c9b66686e1f7 ;;
              candidata) sha=e6df75475bb4c754330521247446dcf11ab90900 ;;
            esac
            git checkout --detach "$sha"
            pnpm install --frozen-lockfile
            COLONIA_TEST_COVERAGE=1 pnpm build:web
            for modo in oficial diagnostico; do
              case "$modo" in
                oficial) nivel=0; informe=perf.json ;;
                diagnostico) nivel=1; informe=perf-diagnostics.json ;;
              esac
              prefijo="$directorio/$serie-$modo"
              cat /proc/loadavg /sys/fs/cgroup/cpu.stat > "$prefijo-antes.txt"
              if PERF_DIAGNOSTICS="$nivel" node --no-warnings scripts/perf.ts; then
                echo aprobado > "$prefijo-resultado.txt"
              else
                echo fuera-de-presupuesto > "$prefijo-resultado.txt"
                fallo=1
              fi
              cat /proc/loadavg /sys/fs/cgroup/cpu.stat > "$prefijo-despues.txt"
              mv "e2e/.out/$informe" "$prefijo.json"
            done
          done
          exit "$fallo"
      - name: Guardar las mediciones aunque un presupuesto falle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-rendimiento
          path: ${{ runner.temp }}/informes-aislados
          retention-days: 7
          if-no-files-found: error
